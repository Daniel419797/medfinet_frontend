name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee frontend-check.log

      - name: Upload frontend check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-check-log
          path: frontend-check.log
          if-no-files-found: warn
          retention-days: 7
