name: Frontend checks

on:
  pull_request:
  push:
    branches:
      - main
      - agent/enable-algorand-wallet-ui

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and run checks
        id: checks
        shell: bash
        run: |
          set +e
          npm ci > frontend-check.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm run check >> frontend-check.log 2>&1
            status=$?
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish diagnostic comment
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_EXIT_CODE: ${{ steps.checks.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- wallet-branch-check-diagnostics -->';
            let log = fs.existsSync('frontend-check.log')
              ? fs.readFileSync('frontend-check.log', 'utf8')
              : 'frontend-check.log was not created.';
            if (log.length > 55000) log = `...truncated...\n${log.slice(-55000)}`;
            const body = `${marker}\n## Wallet branch check diagnostics\n\nExit code: \`${process.env.CHECK_EXIT_CODE || 'unknown'}\`\n\n<details open><summary>Output</summary>\n\n\`\`\`text\n${log.replace(/```/g, '``\\`')}\n\`\`\`\n</details>`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = 3;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail when checks failed
        if: steps.checks.outputs.exit_code != '0'
        run: exit "${{ steps.checks.outputs.exit_code }}"
