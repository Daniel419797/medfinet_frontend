name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and run frontend checks
        id: frontend_checks
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            npm ci
            install_status=$?
            if [ "$install_status" -eq 0 ]; then
              npm run check
              check_status=$?
            else
              check_status=$install_status
            fi
            echo "exit_code=$check_status" >> "$GITHUB_OUTPUT"
            exit 0
          } 2>&1 | tee frontend-check.log

      - name: Upload frontend check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-check-log
          path: frontend-check.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when checks failed
        if: steps.frontend_checks.outputs.exit_code != '0'
        run: exit "${{ steps.frontend_checks.outputs.exit_code }}"
