name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and run frontend checks
        id: frontend_checks
        shell: bash
        run: |
          set +e
          npm ci > frontend-check.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm run check >> frontend-check.log 2>&1
            status=$?
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload frontend check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-check-log
          path: frontend-check.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish pull-request diagnostics
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CHECK_EXIT_CODE: ${{ steps.frontend_checks.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- frontend-check-diagnostics -->';
            let log = fs.existsSync('frontend-check.log')
              ? fs.readFileSync('frontend-check.log', 'utf8')
              : 'The workflow did not create frontend-check.log.';
            if (log.length > 55000) log = `...truncated...\n${log.slice(-55000)}`;
            const exitCode = process.env.CHECK_EXIT_CODE || 'unknown';
            const body = `${marker}\n## Frontend check diagnostics\n\nExit code: \`${exitCode}\`\n\n<details><summary>Install and build output</summary>\n\n\`\`\`text\n${log.replace(/```/g, '``\\`')}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail when checks failed
        if: steps.frontend_checks.outputs.exit_code != '0'
        run: exit "${{ steps.frontend_checks.outputs.exit_code }}"
