name: Frontend checks

on:
  pull_request:
  push:
    branches:
      - main
      - agent/enable-algorand-wallet-ui

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and run checks
        id: checks
        shell: bash
        run: |
          set +e
          npm ci > frontend-check.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm run check >> frontend-check.log 2>&1
            status=$?
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-check-log
          path: frontend-check.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when checks failed
        if: steps.checks.outputs.exit_code != '0'
        run: exit "${{ steps.checks.outputs.exit_code }}"
